name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - QA
      - prod
  push:
    branches:
      - dev
      - staging
      - QA
      - prod

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}

jobs:
  backend-quality:
    name: API and service quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_URL \
            SUPABASE_SERVICE_ROLE_KEY \
            SMTP_HOST \
            SMTP_USER \
            SMTP_PASS
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lockfile drift
        run: npm run lockfile:check

      - name: Typecheck
        run: npm run typecheck

      - name: Backend lint
        run: npm run lint:backend

      - name: Backend tests
        run: npm run test:backend

      - name: Build
        run: npm run build

  database-contract:
    name: Supabase migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Migration filename check
        run: npm run migrations:check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase CLI version
        run: supabase --version

      - name: Start Supabase
        run: supabase start

      - name: Supabase service status after start
        run: |
          supabase status || true
          docker ps -a --filter "name=supabase"

      - name: Validate migrations
        run: supabase db reset --local --no-seed --debug

      - name: Supabase DB lint
        run: supabase db lint --local

      - name: Capture Supabase diagnostics
        if: failure()
        run: |
          mkdir -p supabase-debug-logs

          {
            echo "## Supabase version"
            supabase --version || true
            echo
            echo "## Supabase status"
            supabase status || true
            echo
            echo "## Docker containers"
            docker ps -a --filter "name=supabase" || true
          } | tee supabase-debug-logs/summary.log

          for container in $(docker ps -a --filter "name=supabase" --format "{{.Names}}"); do
            echo "::group::${container}"
            docker logs --tail=500 "${container}" 2>&1 | tee "supabase-debug-logs/${container}.log" || true
            docker inspect "${container}" > "supabase-debug-logs/${container}.inspect.json" || true
            echo "::endgroup::"
          done

      - name: Upload Supabase diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-debug-logs
          path: supabase-debug-logs
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  backend-security:
    name: Backend dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lockfile drift
        run: npm run lockfile:check

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
