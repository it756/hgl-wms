name: Promotion Source Guard

on:
  pull_request:
    branches:
      - dev
      - QA
      - staging
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  source-guard:
    name: promotion source guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate promotion path
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "Validating PR source '${HEAD_BRANCH}' into '${BASE_BRANCH}'"

          case "${BASE_BRANCH}" in
            dev)
              echo "PRs from any source branch can target dev."
              ;;
            QA)
              if [ "${HEAD_BRANCH}" != "dev" ]; then
                echo "Only dev can be merged into QA."
                exit 1
              fi
              ;;
            staging)
              if [ "${HEAD_BRANCH}" != "QA" ]; then
                echo "Only QA can be merged into staging."
                exit 1
              fi
              ;;
            main)
              if [ "${HEAD_BRANCH}" != "QA" ] && [[ ! "${HEAD_BRANCH}" =~ ^hotfix/ ]]; then
                echo "Only QA or hotfix/* branches can be merged into main."
                exit 1
              fi
              ;;
            *)
              echo "No promotion rule configured for '${BASE_BRANCH}'."
              ;;
          esac

          echo "Promotion path is valid."
